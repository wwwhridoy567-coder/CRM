<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Center CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['ui-monospace','SFMono-Regular','monospace'] },
      colors: {
        primary: '#6366f1',
        primaryDark: '#4f46e5',
        bg: '#f8fafc',
        surface: '#ffffff',
      }
    }
  }
}
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .skel { background: linear-gradient(90deg,#f1f5f9 0%,#e2e8f0 50%,#f1f5f9 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .toast-enter { animation: slideIn .3s ease-out; }
  @keyframes slideIn { from { transform: translateX(120%); opacity:0 } to { transform:translateX(0); opacity:1 } }
  .modal-bg { background: rgba(15,23,42,.5); backdrop-filter: blur(4px); }
  .nav-active { background: #eef2ff; color: #4f46e5; }
  .nav-active i { color: #4f46e5; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  .tier-pill { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="bg-bg text-slate-800 h-screen overflow-hidden">

<!-- ─── LOGIN SCREEN ─── -->
<div id="loginScreen" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-slate-50">
  <div class="w-full max-w-md p-8">
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-primary text-white flex items-center justify-center font-bold text-2xl mx-auto mb-4 shadow-lg shadow-indigo-300">
        <i class="fa-solid fa-headset"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Call Center CRM</h1>
      <p class="text-slate-500 text-sm mt-1">Sign in to your agent account</p>
    </div>
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Agent ID</label>
          <input id="loginId" type="text" required class="mt-1 w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="e.g., A001">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Password</label>
          <input id="loginPwd" type="password" required class="mt-1 w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="••••••••">
        </div>
        <button type="submit" id="loginBtn" class="w-full py-3 bg-primary hover:bg-primaryDark text-white rounded-xl font-semibold shadow-md transition-all flex items-center justify-center gap-2">
          <span id="loginText">Sign In</span>
          <i id="loginSpin" class="fa-solid fa-spinner fa-spin hidden"></i>
        </button>
        <div id="loginError" class="hidden bg-red-50 text-red-700 text-sm px-4 py-3 rounded-xl border border-red-200"></div>
      </form>
    </div>
  </div>
</div>

<!-- ─── MAIN APP ─── -->
<div id="app" class="hidden h-screen flex overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-surface border-r border-slate-200 flex-col justify-between hidden md:flex">
    <div class="flex-1 overflow-y-auto">
      <div class="h-16 flex items-center px-6 border-b border-slate-100">
        <div class="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center font-bold mr-3 shadow-md">
          <i class="fa-solid fa-headset text-sm"></i>
        </div>
        <span class="font-bold text-base text-slate-900 tracking-tight">CRM System</span>
      </div>
      <div class="px-6 py-5 border-b border-slate-100">
        <div class="flex items-center gap-3">
          <div id="userAvatar" class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-sm"></div>
          <div class="min-w-0 flex-1">
            <p id="userName" class="font-semibold text-sm text-slate-900 truncate"></p>
            <p id="userRole" class="text-xs text-slate-500 font-medium bg-slate-100 px-2 py-0.5 rounded-full inline-block mt-1"></p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-1" id="navMenu">
        <p class="px-2 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 mt-2">Main</p>
        <a data-view="dashboard" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 cursor-pointer transition-colors"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</a>
        <a data-view="leads" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 cursor-pointer transition-colors"><i class="fa-solid fa-users w-5"></i> Tele-sales Leads</a>
        <a data-view="search" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 cursor-pointer transition-colors"><i class="fa-solid fa-magnifying-glass w-5"></i> Search Customers</a>
        <a data-view="leaderboard" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 cursor-pointer transition-colors"><i class="fa-solid fa-trophy w-5"></i> Leaderboard</a>
        <p class="px-2 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 mt-6">Management</p>
        <a data-view="attendance" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 cursor-pointer transition-colors"><i class="fa-solid fa-clipboard-user w-5"></i> Attendance</a>
        <a data-view="mistakes" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 cursor-pointer transition-colors"><i class="fa-solid fa-triangle-exclamation w-5"></i> Mistake Logs</a>
        <a data-view="promo" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 cursor-pointer transition-colors"><i class="fa-solid fa-ticket w-5"></i> Promo Bonus</a>
      </nav>
    </div>
    <!-- Session widget -->
    <div class="p-4 border-t border-slate-200 bg-slate-50">
      <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm text-center">
        <p class="text-xs text-slate-500 font-medium mb-1">Current Session</p>
        <p id="sessionTimer" class="text-2xl font-bold text-slate-800 font-mono tracking-tight mb-3">00:00:00</p>
        <button id="clockBtn" class="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-sm font-medium transition-all shadow-md">Clock In</button>
        <button id="logoutBtn" class="w-full mt-2 py-2 text-slate-500 hover:text-slate-700 text-xs">Logout</button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col h-full overflow-hidden bg-bg">
    <header class="h-16 bg-surface border-b border-slate-200 flex items-center justify-between px-6 z-10">
      <div class="flex items-center gap-2 text-sm text-slate-500">
        <i class="fa-solid fa-house"></i>
        <span>/</span>
        <span id="breadcrumb" class="text-slate-900 font-medium">Dashboard</span>
      </div>
      <div class="flex items-center gap-3">
        <input id="dateFrom" type="date" class="px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary">
        <span class="text-slate-400 text-sm">→</span>
        <input id="dateTo" type="date" class="px-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary">
        <button id="refreshBtn" class="w-10 h-10 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 flex items-center justify-center"><i class="fa-solid fa-rotate"></i></button>
      </div>
    </header>
    <div id="viewArea" class="flex-1 overflow-auto p-6"></div>
  </main>
</div>

<!-- Toast container -->
<div id="toasts" class="fixed top-6 right-6 z-[100] space-y-2 pointer-events-none"></div>

<!-- Modal container -->
<div id="modalRoot"></div>

<script>
// ════════════════════════════════════════════════════════════
// CONFIG & STATE
// ════════════════════════════════════════════════════════════
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxN4tVQtuWVfGKStoR7c_b7IGng1u35b2HyMaD1LNBa68j-PjHArDiVSqrvVuy5Xxee/exec';
const STORE_KEY = 'cccrm_v1';
const state = {
  apiUrl: BACKEND_URL,
  user: JSON.parse(localStorage.getItem(STORE_KEY + '_user') || 'null'),
  view: 'dashboard',
  dateFrom: '',
  dateTo: '',
  session: { active: null, todayTotal: 0, tickInterval: null }
};

// ════════════════════════════════════════════════════════════
// API HELPER
// ════════════════════════════════════════════════════════════
async function api(action, params = {}, method = 'GET') {
  if (method === 'GET') {
    const url = new URL(state.apiUrl);
    url.searchParams.set('action', action);
    Object.entries(params).forEach(([k, v]) => {
      if (v !== undefined && v !== null) url.searchParams.set(k, v);
    });
    const r = await fetch(url.toString());
    return r.json();
  } else {
    const r = await fetch(state.apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...params })
    });
    return r.json();
  }
}

// ════════════════════════════════════════════════════════════
// UTILITIES
// ════════════════════════════════════════════════════════════
function $(id) { return document.getElementById(id); }
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function firstOfMonth() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10); }
function fmtMoney(n) { return Number(n||0).toLocaleString('en-US'); }
function fmtSec(s) { const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60; return [h,m,sec].map(v=>String(v).padStart(2,'0')).join(':'); }
function initials(name) { return (name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function esc(s) { return String(s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function toast(msg, type='info') {
  const colors = { info:'bg-slate-900', success:'bg-emerald-600', error:'bg-red-600', warn:'bg-amber-500' };
  const icons = { info:'fa-circle-info', success:'fa-circle-check', error:'fa-circle-xmark', warn:'fa-triangle-exclamation' };
  const t = el('div', `toast-enter pointer-events-auto ${colors[type]} text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-sm font-medium max-w-sm`,
    `<i class="fa-solid ${icons[type]}"></i><span>${esc(msg)}</span>`);
  $('toasts').appendChild(t);
  setTimeout(()=>{ t.style.transition='all .3s'; t.style.opacity='0'; t.style.transform='translateX(120%)'; setTimeout(()=>t.remove(),300); }, 3500);
}
function skel(count=3, height='h-20') {
  return Array.from({length:count}, ()=>`<div class="skel ${height} rounded-xl"></div>`).join('');
}
function isAdmin() { return state.user && (state.user.role === 'admin' || state.user.role === 'main_admin'); }

// ════════════════════════════════════════════════════════════
// MODAL HELPER
// ════════════════════════════════════════════════════════════
function modal(title, bodyHTML, opts = {}) {
  const root = $('modalRoot');
  const maxW = opts.maxWidth || 'max-w-lg';
  root.innerHTML = `
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" id="modalOverlay">
      <div class="bg-white rounded-2xl shadow-2xl w-full ${maxW} max-h-[90vh] flex flex-col">
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
          <h3 class="font-bold text-slate-900">${esc(title)}</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-6 overflow-y-auto">${bodyHTML}</div>
        ${opts.footer ? `<div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-2">${opts.footer}</div>` : ''}
      </div>
    </div>`;
  $('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') closeModal(); });
}
function closeModal() { $('modalRoot').innerHTML = ''; }

// ════════════════════════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════════════════════════
function showLogin() {
  $('app').classList.add('hidden');
  $('loginScreen').classList.remove('hidden');
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  $('loginText').classList.add('hidden');
  $('loginSpin').classList.remove('hidden');
  $('loginError').classList.add('hidden');

  try {
    const res = await api('login', { agentId: $('loginId').value.trim(), password: $('loginPwd').value });
    if (res.status === 'ok') {
      state.user = res.agent;
      localStorage.setItem(STORE_KEY + '_user', JSON.stringify(res.agent));
      enterApp();
    } else {
      showLoginError(res.message || 'Login failed');
    }
  } catch (err) {
    showLoginError('Connection failed: ' + err.message);
  } finally {
    $('loginText').classList.remove('hidden');
    $('loginSpin').classList.add('hidden');
  }
});

function showLoginError(msg) {
  $('loginError').textContent = msg;
  $('loginError').classList.remove('hidden');
}

$('logoutBtn').addEventListener('click', () => {
  if (state.session.active) { toast('Clock out before logging out', 'warn'); return; }
  localStorage.removeItem(STORE_KEY + '_user');
  state.user = null;
  showLogin();
});

// ════════════════════════════════════════════════════════════
// APP ENTRY
// ════════════════════════════════════════════════════════════
function enterApp() {
  $('loginScreen').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('userName').textContent = state.user.name;
  $('userRole').textContent = state.user.role.replace('_',' ').toUpperCase();
  $('userAvatar').textContent = initials(state.user.name);
  state.dateFrom = firstOfMonth();
  state.dateTo = todayStr();
  $('dateFrom').value = state.dateFrom;
  $('dateTo').value = state.dateTo;
  setupNav();
  setupDateHandlers();
  loadSessionStatus();
  renderView('dashboard');
}

function setupNav() {
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', () => renderView(link.dataset.view));
  });
}

function setupDateHandlers() {
  $('dateFrom').addEventListener('change', e => { state.dateFrom = e.target.value; renderView(state.view); });
  $('dateTo').addEventListener('change', e => { state.dateTo = e.target.value; renderView(state.view); });
  $('refreshBtn').addEventListener('click', () => renderView(state.view));
}

function renderView(view) {
  state.view = view;
  document.querySelectorAll('.nav-link').forEach(l => {
    l.classList.toggle('nav-active', l.dataset.view === view);
  });
  const labels = { dashboard:'Dashboard', leads:'Tele-sales Leads', search:'Search Customers', leaderboard:'Leaderboard', attendance:'Attendance', mistakes:'Mistake Logs', promo:'Promo Bonus' };
  $('breadcrumb').textContent = labels[view];
  const renders = { dashboard:renderDashboard, leads:renderLeads, search:renderSearch, leaderboard:renderLeaderboard, attendance:renderAttendance, mistakes:renderMistakes, promo:renderPromo };
  renders[view]();
}

// ════════════════════════════════════════════════════════════
// SESSION TIMER
// ════════════════════════════════════════════════════════════
async function loadSessionStatus() {
  try {
    const r = await api('getSessionHistory', { agentId: state.user.id, date: todayStr() });
    if (r.status === 'ok') {
      state.session.active = r.activeSession;
      state.session.todayTotal = r.totalSeconds || 0;
      updateSessionUI();
      if (state.session.active) startTicker();
    }
  } catch (e) { console.warn('Session load failed', e); }
}

function updateSessionUI() {
  const btn = $('clockBtn');
  if (state.session.active) {
    btn.textContent = 'Clock Out';
    btn.classList.remove('bg-slate-900','hover:bg-slate-800');
    btn.classList.add('bg-red-500','hover:bg-red-600');
  } else {
    btn.textContent = 'Clock In';
    btn.classList.remove('bg-red-500','hover:bg-red-600');
    btn.classList.add('bg-slate-900','hover:bg-slate-800');
  }
}

function startTicker() {
  clearInterval(state.session.tickInterval);
  const tick = () => {
    if (!state.session.active) { $('sessionTimer').textContent = fmtSec(state.session.todayTotal); return; }
    const [h,m,s] = state.session.active.clockIn.split(':').map(Number);
    const now = new Date();
    const start = new Date(); start.setHours(h, m, s, 0);
    const elapsed = Math.max(0, Math.floor((now - start)/1000));
    $('sessionTimer').textContent = fmtSec(state.session.todayTotal + elapsed);
  };
  tick();
  state.session.tickInterval = setInterval(tick, 1000);
}

$('clockBtn').addEventListener('click', async () => {
  const btn = $('clockBtn');
  btn.disabled = true;
  try {
    if (state.session.active) {
      const r = await api('clockOut', { agentId: state.user.id, agentName: state.user.name }, 'POST');
      if (r.status === 'ok') {
        state.session.todayTotal += r.totalSeconds;
        state.session.active = null;
        clearInterval(state.session.tickInterval);
        $('sessionTimer').textContent = fmtSec(state.session.todayTotal);
        updateSessionUI();
        toast('Clocked out', 'success');
      } else toast(r.message || 'Failed', 'error');
    } else {
      const r = await api('clockIn', { agentId: state.user.id, agentName: state.user.name }, 'POST');
      if (r.status === 'ok') {
        state.session.active = { clockIn: r.clockIn, id: r.id };
        updateSessionUI();
        startTicker();
        toast('Clocked in', 'success');
      } else toast(r.message || 'Failed', 'error');
    }
  } catch (e) { toast(e.message, 'error'); }
  btn.disabled = false;
});

// ════════════════════════════════════════════════════════════
// VIEW: DASHBOARD
// ════════════════════════════════════════════════════════════
async function renderDashboard() {
  const area = $('viewArea');
  area.innerHTML = `
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Welcome back, ${esc(state.user.name)}</h1>
      <p class="text-slate-500 mt-1">${isAdmin() ? 'Team-wide overview' : 'Your personal performance'} • ${state.dateFrom} → ${state.dateTo}</p>
    </div>
    <div id="kpiCards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">${skel(4,'h-32')}</div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
        <h2 class="text-lg font-bold text-slate-900 mb-4">Performance by List</h2>
        <div id="listReportArea">${skel(3,'h-12')}</div>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
        <h2 class="text-lg font-bold text-slate-900 mb-4">Top Performers</h2>
        <div id="topPerfArea">${skel(5,'h-14')}</div>
      </div>
    </div>`;

  const params = { from: state.dateFrom, to: state.dateTo };
  if (!isAdmin()) params.agentName = state.user.name;

  try {
    const r = await api('getSummaryCards', params);
    if (r.status === 'ok') {
      const c = r.cards;
      $('kpiCards').innerHTML = `
        ${kpiCard('Total Calls', fmtMoney(c.totalCalls), 'fa-phone-volume', 'bg-blue-50 text-blue-600')}
        ${kpiCard('Deposits', fmtMoney(c.totalDeposits), 'fa-money-bill-transfer', 'bg-emerald-50 text-emerald-600')}
        ${kpiCard('Amount (৳)', fmtMoney(c.totalAmount), 'fa-coins', 'bg-amber-50 text-amber-600')}
        ${kpiCard('Conversion', c.conversionPct + '%', 'fa-chart-line', 'bg-purple-50 text-purple-600')}`;
    }
  } catch (e) { $('kpiCards').innerHTML = errBox(e.message); }

  try {
    const r = await api('getListReport', params);
    if (r.status === 'ok') {
      const rows = r.listReport;
      $('listReportArea').innerHTML = rows.length === 0 ? emptyBox('No data for this period') : `
        <table class="w-full text-sm">
          <thead><tr class="text-xs text-slate-500 uppercase tracking-wider border-b border-slate-100">
            <th class="text-left py-2 font-semibold">List</th>
            <th class="text-right py-2 font-semibold">Calls</th>
            <th class="text-right py-2 font-semibold">Deposits</th>
            <th class="text-right py-2 font-semibold">Amount</th>
            <th class="text-right py-2 font-semibold">Conv%</th>
          </tr></thead>
          <tbody class="divide-y divide-slate-100">
            ${rows.map(row => `<tr class="hover:bg-slate-50">
              <td class="py-3 font-semibold text-slate-900">${esc(row.list)}</td>
              <td class="py-3 text-right">${fmtMoney(row.calls)}</td>
              <td class="py-3 text-right text-emerald-700 font-medium">${fmtMoney(row.deposits)}</td>
              <td class="py-3 text-right">৳${fmtMoney(row.amount)}</td>
              <td class="py-3 text-right"><span class="px-2 py-0.5 rounded-full text-xs font-bold ${parseFloat(row.conversion)>=15?'bg-emerald-100 text-emerald-700':parseFloat(row.conversion)>=10?'bg-amber-100 text-amber-700':'bg-slate-100 text-slate-600'}">${row.conversion}%</span></td>
            </tr>`).join('')}
          </tbody>
        </table>`;
    }
  } catch (e) { $('listReportArea').innerHTML = errBox(e.message); }

  try {
    const r = await api('getTopPerformers', params);
    if (r.status === 'ok') {
      const rows = r.topPerformers.slice(0,5);

async function submitLead() {
  const form = $('leadForm');
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());
  data.depositAmount = Number(data.depositAmount) || 0;
  data.agentId = state.user.id;
  data.agentName = state.user.name;
  data.lastContact = todayStr();
  try {
    const action = data.id ? 'updateWtCustomer' : 'saveWtCustomer';
    const payload = data.id ? data : { customer: data };
    const r = await api(action, payload, 'POST');
    if (r.status === 'ok') { toast('Saved', 'success'); closeModal(); renderLeads(); }
    else toast(r.message || 'Failed', 'error');
  } catch (e) { toast(e.message, 'error'); }
}

function editLead(c) { openLeadForm(c); }

async function deleteLead(id) {
  if (!confirm('Delete this lead?')) return;
  try {
    const r = await api('deleteWtCustomer', { id }, 'POST');
    if (r.status === 'ok') { toast('Deleted', 'success'); renderLeads(); }
    else toast(r.message || 'Failed', 'error');
  } catch (e) { toast(e.message, 'error'); }
}

    good: { color: 'bg-blue-50 border-blue-200', text: 'text-blue-700', textDark: 'text-blue-900', icon: 'fa-thumbs-up', label: 'Good — Stay consistent!' },

        <p class="text-xs font-semibold text-amber-700 uppercase">Short</p>
        <p class="text-2xl font-bold text-amber-900 mt-1">${r.short}</p>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-4">
        <p class="text-xs font-semibold text-red-700 uppercase">Absent</p>
        <p class="text-2xl font-bold text-red-900 mt-1">${r.absent}</p>
      </div>

// ─── ADMIN: Override modal for one specific day ───
function openAttendanceOverrideModal(agentId, date, currentStatus, actualSec) {
  const sec = parseInt(actualSec) || 0;
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);

  const bodyHTML = `
    <div class="bg-slate-50 p-3 rounded-lg mb-4 text-sm">
      <p><span class="text-slate-500">Date:</span> <span class="font-semibold">${date}</span></p>
      <p><span class="text-slate-500">System calculated:</span> <span class="font-mono font-semibold text-slate-900">${h}h ${String(m).padStart(2,'0')}m worked</span></p>
      <p><span class="text-slate-500">Current status:</span> <span class="font-bold uppercase ${currentStatus === 'full' ? 'text-emerald-700' : currentStatus === 'short' ? 'text-amber-700' : currentStatus === 'absent' ? 'text-red-700' : 'text-slate-600'}">${currentStatus}</span></p>
    </div>
    <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2 block">Change status to</label>
    <div class="grid grid-cols-4 gap-2 mb-4" id="overrideStatusBtns">
      <button data-status="full" class="ov-status-btn px-3 py-2 bg-emerald-50 border-2 border-emerald-300 text-emerald-700 rounded font-bold text-sm">Full</button>
      <button data-status="short" class="ov-status-btn px-3 py-2 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 rounded font-medium text-sm">Short</button>
      <button data-status="absent" class="ov-status-btn px-3 py-2 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 rounded font-medium text-sm">Absent</button>
      <button data-status="off" class="ov-status-btn px-3 py-2 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 rounded font-medium text-sm">Off</button>
    </div>
    <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2 block">Admin note (reason)</label>
    <textarea id="overrideNote" placeholder="e.g., Approved early leave due to family emergency..." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm mb-3" rows="2"></textarea>
    <input type="hidden" id="overrideStatus" value="full">
    <input type="hidden" id="overrideAgentId" value="${esc(agentId)}">
    <input type="hidden" id="overrideDate" value="${esc(date)}">
    <input type="hidden" id="overrideOrigStatus" value="${esc(currentStatus)}">
    <input type="hidden" id="overrideActualSec" value="${sec}">
  `;
  modal('Override Day Status', bodyHTML, {
    maxWidth: 'max-w-md',
    footer: `<button onclick="closeModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
             <button onclick="submitOverride()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold">Save override</button>`
  });

  // Wire up status buttons
  document.querySelectorAll('.ov-status-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ov-status-btn').forEach(b => {
        b.className = 'ov-status-btn px-3 py-2 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 rounded font-medium text-sm';
      });
      const color = { full: 'emerald', short: 'amber', absent: 'red', off: 'slate' }[btn.dataset.status];
      btn.className = `ov-status-btn px-3 py-2 bg-${color}-50 border-2 border-${color}-300 text-${color}-700 rounded font-bold text-sm`;
      $('overrideStatus').value = btn.dataset.status;
    });
  });
}

async function submitOverride() {
  const agentId = $('overrideAgentId').value;
  const date = $('overrideDate').value;
  const overrideStatus = $('overrideStatus').value;
  const adminNote = $('overrideNote').value;
  const originalStatus = $('overrideOrigStatus').value;
  const actualSeconds = parseInt($('overrideActualSec').value) || 0;

  try {
    const r = await api('saveAttendanceOverride', {
      agentId, date, overrideStatus, adminNote, originalStatus, actualSeconds,
      actionBy: state.user.name, role: state.user.role
    }, 'POST');
    if (r.status === 'ok') {
      toast('Override saved', 'success');
      closeModal();
      renderView('attendance');
    } else toast(r.message || 'Failed', 'error');
  } catch (e) { toast(e.message, 'error'); }
}

async function clearOverride(agentId, date) {
  if (!confirm('Remove this override? Day will revert to system-calculated status.')) return;
  try {
    const r = await api('clearAttendanceOverride', {
      agentId, date, role: state.user.role
    }, 'POST');
    if (r.status === 'ok') {
      toast('Override cleared', 'success');
      closeModal();
      renderView('attendance');
    } else toast(r.message || 'Failed', 'error');
  } catch (e) { toast(e.message, 'error'); }
}

function openOffDayChangeModal(agentId, currentOffDay) {
  const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday'];
  const peakDays = ['Thursday', 'Friday', 'Saturday'];

  modal('Change Off Day', `
    <p class="text-sm text-slate-600 mb-3">Current off day: <span class="font-bold text-primary">${esc(currentOffDay)}</span></p>
    <p class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-2 mb-3">
      <i class="fa-solid fa-circle-info"></i> Peak days (Thursday, Friday, Saturday) cannot be set as off day.
    </p>
    <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2 block">Select new off day</label>
    <div class="grid grid-cols-2 gap-2">
      ${days.map(d => `<button onclick="confirmOffDayChange('${esc(agentId)}','${d}')" class="px-3 py-2 bg-white border border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 rounded font-medium text-sm ${d === currentOffDay ? 'ring-2 ring-indigo-400' : ''}">${d}</button>`).join('')}
    </div>
    <p class="text-xs text-slate-400 mt-4 text-center">Disabled (peak): ${peakDays.join(', ')}</p>
  `, { maxWidth: 'max-w-sm' });
}

async function confirmOffDayChange(agentId, newOffDay) {
  try {
    const r = await api('changeOffDay', {
      agentId, newOffDay, role: state.user.role
    }, 'POST');
    if (r.status === 'ok') {
      toast('Off day changed to ' + newOffDay, 'success');
      closeModal();
      renderView('attendance');
    } else toast(r.message || 'Failed', 'error');
  } catch (e) { toast(e.message, 'error'); }
}

async function submitMistake() {
  const form = $('mkForm');
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());
  const sel = form.querySelector('select[name="agentId"] option:checked');
  data.agentName = sel ? sel.dataset.name : '';
  data.submittedBy = state.user.name;
  data.role = state.user.role;
  try {
    const r = await api('saveMistake', { mistake: data, role: state.user.role }, 'POST');
    if (r.status === 'ok') { toast('Mistake logged', 'success'); closeModal(); renderMistakes(); }
    else toast(r.message || 'Failed', 'error');
  } catch (e) { toast(e.message, 'error'); }
}

async function reviewMistake(id) {
  try {
    const r = await api('updateMistake', { id, status: 'Reviewed', role: state.user.role }, 'POST');
    if (r.status === 'ok') { toast('Marked reviewed', 'success'); renderMistakes(); }
    else toast(r.message || 'Failed', 'error');
  } catch (e) { toast(e.message, 'error'); }
}

async function deleteMistake(id) {
  if (!confirm('Delete this mistake?')) return;
  try {
    const r = await api('deleteMistake', { id, role: state.user.role }, 'POST');
    if (r.status === 'ok') { toast('Deleted', 'success'); renderMistakes(); }
    else toast(r.message || 'Failed', 'error');
  } catch (e) { toast(e.message, 'error'); }
}

function renderMyTierBreakdown() {
  const v = promoState.vouchers;
  if (!v.length) { $('promoMyTierBreakdown').innerHTML = ''; return; }

  // Group by tier
  const byTier = {};
  [1,2,3,4,5,6].forEach(t => { byTier[t] = { total: 0, done: 0 }; });
  v.forEach(x => {
    const t = byTier[x.tier];
    if (!t) return;
    t.total++;
    if (String(x.status).toUpperCase() === 'DONE') t.done++;
  });

  const rows = [1,2,3,4,5,6].map(t => {
    const tb = byTier[t];
    if (tb.total === 0) return '';
    const meta = PROMO_TIER_META[t];
    const pct = tb.total > 0 ? Math.round((tb.done / tb.total) * 100) : 0;
    return `<div class="flex items-center gap-3 text-xs">

    if (f.agent === 'unassigned') rows = rows.filter(v => !v.agent);
    else rows = rows.filter(v => v.agent.toUpperCase() === f.agent.toUpperCase());

    const q = f.search.trim().toLowerCase();
    rows = rows.filter(v => v.voucher.toLowerCase().includes(q) || (v.customer || '').toLowerCase().includes(q));

  if (!rows.length) {
    $('promoTable').innerHTML = emptyBox('No vouchers match your filters');

  // Limit to 200 rows for performance
  const displayRows = rows.slice(0, 200);
  const truncated = rows.length > 200;

  const tableHead = isAdminUser
    ? `<tr class="text-left text-xs text-slate-500 uppercase tracking-wide bg-slate-50 border-b border-slate-200">

function toggleDistributeAgent(agent) {
  const idx = promoState.distributeSelectedAgents.indexOf(agent);
  if (idx >= 0) {
    promoState.distributeSelectedAgents.splice(idx, 1);
  } else {
    promoState.distributeSelectedAgents.push(agent);
  }
  refreshDistributeChips();
  updateDistributePreview();
}

function selectAllDistributeAgents(selectAll) {
  promoState.distributeSelectedAgents = selectAll ? PROMO_AGENTS.slice() : [];
  refreshDistributeChips();
  updateDistributePreview();
}

function refreshDistributeChips() {
  document.querySelectorAll('.dist-agent-chip').forEach(btn => {
    const a = btn.dataset.agent;
    const selected = promoState.distributeSelectedAgents.indexOf(a) >= 0;
    if (selected) {
      btn.className = 'dist-agent-chip inline-flex items-center gap-1.5 px-3 py-1.5 bg-indigo-600 text-white rounded-full text-xs font-semibold transition';
      btn.innerHTML = `<i class="fa-solid fa-check text-[10px]"></i> ${a}`;
    } else {
      btn.className = 'dist-agent-chip inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-600 rounded-full text-xs font-medium transition';
      btn.innerHTML = a;
    }
  });
  const cnt = $('distSelectedCount');
  if (cnt) cnt.textContent = promoState.distributeSelectedAgents.length;
}

function setDistQty(n) {
  const input = $('distQty');
  if (input) {
    input.value = n;
    updateDistributePreview();
  }
}

function setDistQtyAll() {
  const sel = $('distTier');
  if (!sel) return;
  const opt = sel.options[sel.selectedIndex];
  const available = parseInt(opt.dataset.available || 0);
  setDistQty(available);
}

function updateDistributePreview() {
  const sel = $('distTier');
  const qtyInput = $('distQty');
  const previewText = $('distPreviewText');
  const availSpan = $('distAvailable');
  if (!sel || !qtyInput || !previewText) return;

  const opt = sel.options[sel.selectedIndex];
  const available = parseInt(opt.dataset.available || 0);
  const tierName = PROMO_TIER_META[sel.value].name;
  const qty = parseInt(qtyInput.value || 0);
  const numAgents = promoState.distributeSelectedAgents.length;

  if (availSpan) availSpan.textContent = `of ${fmtMoney(available)} available`;

  if (numAgents === 0) {
    previewText.innerHTML = '<span class="font-semibold">No agents selected.</span> Pick at least one agent.';
    return;
  }

  if (qty <= 0) {
    previewText.innerHTML = '<span class="font-semibold">Set quantity.</span> Enter how many vouchers to distribute.';
    return;
  }

  const actualQty = Math.min(qty, available);
  const base = Math.floor(actualQty / numAgents);
  const remainder = actualQty % numAgents;
  const perAgentDesc = remainder === 0 
    ? `${fmtMoney(base)} vouchers per agent`
    : `${fmtMoney(base)} per agent (${remainder} get +1 extra)`;

  let warning = '';
  if (qty > available) {
    warning = `<p class="mt-1 text-red-700"><strong>Note:</strong> Only ${fmtMoney(available)} available, ${fmtMoney(qty - available)} will be skipped.</p>`;
  }

  previewText.innerHTML = `
    <p><strong>Preview:</strong> Will assign <strong>${fmtMoney(actualQty)} vouchers</strong> from ${tierName} — <strong>${perAgentDesc}</strong> across <strong>${numAgents} selected agents</strong>. Vouchers are randomly shuffled before assignment.</p>
    ${warning}
  `;
}

async function submitPromoUpdate(tier, row) {
  const status = $('agentVStatus').value;
  const customer = $('agentVCust').value.trim();
  try {
    const r = await api('promo_update', { tier, row, status, customer }, 'POST');
    if (r.status === 'ok') {
      closeModal();
      toast('Voucher updated', 'success');
      loadPromoData();
    } else toast(r.message || 'Failed', 'error');
  } catch (e) { toast(e.message, 'error'); }
}

async function submitPromoEdit(tier, row) {
  const agent = $('adminVAgent').value.trim().toUpperCase();
  const status = $('adminVStatus').value;
  const customer = $('adminVCust').value.trim();
  try {
    const a = await api('promo_assign', { tier, row, agent }, 'POST');
    if (a.status !== 'ok') { toast(a.message || 'Failed to assign', 'error'); return; }
    const u = await api('promo_update', { tier, row, status, customer }, 'POST');
    if (u.status === 'ok') {
      closeModal();
      toast('Voucher updated', 'success');
      loadPromoData();
    } else toast(u.message || 'Failed', 'error');
  } catch (e) { toast(e.message, 'error'); }
}

async function submitPromoAdd() {
  const tier = parseInt($('addVTier').value);
  const text = $('addVList').value.trim();
  if (!text) { toast('Please paste voucher numbers', 'error'); return; }
  const vouchers = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!vouchers.length) { toast('No valid vouchers', 'error'); return; }

  try {
    const r = await api('promo_add', { tier, vouchers }, 'POST');
    if (r.status === 'ok') {
      closeModal();
      toast(`Added ${r.added} vouchers${r.skipped ? ' (' + r.skipped + ' duplicates skipped)' : ''}`, 'success');
      loadPromoData();
    } else toast(r.message || 'Failed', 'error');
  } catch (e) { toast(e.message, 'error'); }
}

async function submitPromoDistribute() {
  const tier = parseInt($('distTier').value);
  const qty = parseInt($('distQty').value || 0);
  const agents = promoState.distributeSelectedAgents.slice();

  if (!agents.length) { toast('Select at least one agent', 'error'); return; }
  if (qty <= 0) { toast('Set quantity > 0', 'error'); return; }

  const btn = $('distSubmitBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Distributing...'; }

  try {
    const r = await api('promo_distribute', { tier, qty, agents, mode: 'equal' }, 'POST');
    if (r.status === 'ok') {
      closeModal();
      const summary = Object.entries(r.summary || {}).map(([k,v]) => `${k}: ${v}`).join(', ');
      toast(`Distributed ${r.assigned} vouchers — ${summary}`, 'success');
      loadPromoData();
    } else {
      toast(r.message || 'Distribution failed', 'error');
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-1"></i> Distribute'; }
    }
  } catch (e) {
    toast(e.message, 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-1"></i> Distribute'; }
  }
}

async function deletePromoVoucher(tier, row) {
  if (!confirm('Delete this voucher? This cannot be undone.')) return;
  try {
    const r = await api('promo_delete', { tier, row }, 'POST');
    if (r.status === 'ok') { toast('Deleted', 'success'); loadPromoData(); }
    else toast(r.message || 'Failed', 'error');
  } catch (e) { toast(e.message, 'error'); }
}
